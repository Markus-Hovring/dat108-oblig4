<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link href="css/simple.css" rel="stylesheet" type="text/css" />
	<title>Påmelding</title>
</head>

<body>
	<h2>Påmelding</h2>

	<p style="color:red" th:if="${feilmelding}" th:text="${feilmelding}"></p>

	<form action="paamelding" method="post" th:object="${deltager}">
		<label>Fornavn</label>
		<input type="text" th:field="*{fornavn}">
		<label>Etternavn</label>
		<input type="text" th:field="*{etternavn}">
		<label>Mobil(8 siffer)</label>
		<input type="text" th:field="*{mobil}">
		<label>Passord</label>
		<input type="password" name="passord">
		<label>Passord repetert</label>
		<input type="password" name="passordRepetert">
		<label>Kjønn</label>
		<input type="radio" th:field="*{kjonn}" value="mann"> mann
		<input type="radio" th:field="*{kjonn}" value="kvinne"> kvinne
		<button type="submit">Meld meg på</button>
	</form>

</body>
</html>
